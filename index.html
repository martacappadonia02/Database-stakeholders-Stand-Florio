<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rubrica Stand Florio</title>
<style>
/* Layout: barra evento in alto, quattro schede (Report · Inviti · Contatti · Eventi), tabelle operative a tutta larghezza */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --sunk:#ECEBE7; --ink:#1E1A1B; --muted:#6A6265; --line:#DEDAD6;
  --marsala:#7B1E2E; --marsala-soft:#F4E5E8; --sole:#F2C618; --sole-ink:#3B2A00; --tonno:#2D4A7C; --tonno-soft:#E4EAF4;
  --ok:#2C7448; --ok-soft:#E1F0E6; --warn:#9A5B00; --warn-soft:#FBEED6; --bad:#A1302B; --bad-soft:#F8E1DF; --idle:#6A6265; --idle-soft:#ECEBE7;
  --f-display:"Futura","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161C; --surface:#1B1F27; --sunk:#232833; --ink:#ECE9E5; --muted:#A49EA0; --line:#2F3440;
  --marsala:#E48B9B; --marsala-soft:#3A2329; --sole:#F2C618; --sole-ink:#2A1E00; --tonno:#94B3E8; --tonno-soft:#232E44;
  --ok:#72C493; --ok-soft:#1E3326; --warn:#E6A94E; --warn-soft:#3A2D16; --bad:#F08479; --bad-soft:#3D2220; --idle:#A49EA0; --idle-soft:#262A33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1B1F27; --sunk:#232833; --ink:#ECE9E5; --muted:#A49EA0; --line:#2F3440;
  --marsala:#E48B9B; --marsala-soft:#3A2329; --sole:#F2C618; --sole-ink:#2A1E00; --tonno:#94B3E8; --tonno-soft:#232E44;
  --ok:#72C493; --ok-soft:#1E3326; --warn:#E6A94E; --warn-soft:#3A2D16; --bad:#F08479; --bad-soft:#3D2220; --idle:#A49EA0; --idle-soft:#262A33;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tonno);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* testata */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--marsala)}
.brand small{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--muted)}
.brand h1{font-size:28px;letter-spacing:.01em}
.evbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.evbar label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.evbar select{max-width:280px}
.countdown{background:var(--sole);color:var(--sole-ink);font-family:var(--f-display);font-weight:600;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.countdown.past{background:var(--sunk);color:var(--muted)}

/* schede */
nav.tabs{display:flex;gap:4px;margin:18px 0 22px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--marsala);border-bottom-color:var(--marsala)}
nav.tabs .n{font-family:var(--f-body);font-size:12px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}

/* controlli */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--marsala);border-color:var(--marsala);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
.toolbar input[type=search]{width:100%}
.hint{color:var(--muted);font-size:13px}

/* tabelle */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* elenchi lunghi: area con altezza fissa, così la barra di scorrimento orizzontale resta sempre visibile */
.tbl-wrap.scroll{overflow:auto;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);min-height:260px;overscroll-behavior:contain}
.tbl-wrap.scroll table{border-collapse:separate;border-spacing:0}
.tbl-wrap.scroll thead th{position:sticky;top:0;z-index:2}
@media (min-width:700px){
  .tbl-wrap.scroll th:first-child,.tbl-wrap.scroll td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line);min-width:220px}
  .tbl-wrap.scroll thead th:first-child{z-index:3;background:var(--sunk)}
}
.scroll-nav{display:flex;gap:6px;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:13px}
td.c{text-align:center}
td input[type=date]{width:140px;padding:4px 6px}
td input[type=number]{width:60px;padding:4px 6px}
td select{padding:4px 6px}
td input.note{width:200px;padding:4px 6px}
.copyable{user-select:all;word-break:break-all}

/* stati */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-da_invitare{background:var(--idle-soft);color:var(--idle)}
.st-invitato{background:var(--tonno-soft);color:var(--tonno)}
.st-sollecitato{background:var(--warn-soft);color:var(--warn)}
.st-confermato{background:var(--ok-soft);color:var(--ok)}
.st-rifiutato{background:var(--bad-soft);color:var(--bad)}
select.stsel{font-weight:600;border-radius:999px}
.cat{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--marsala-soft);color:var(--marsala);white-space:nowrap}
.evchip{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;margin:0 4px 4px 0;white-space:nowrap}
.flag{color:var(--warn);font-weight:600;font-size:12px;display:block}

/* filtri stato */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* report */
.report-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.report-head h2{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1.1;margin-top:4px}
.kpi .det{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.hero{border-color:var(--marsala);background:var(--marsala-soft)}
.kpi.hero .val{color:var(--marsala)}
.kpi.alert .val{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;color:var(--marsala)}
.funnel{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.fbar{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--tonno)}
.fbar span.ok{background:var(--ok)}
.fbar span.target{background:var(--marsala)}
.frow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.settings label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.settings input{width:90px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
ul.plain li:last-child{border-bottom:0}
.formula{font-size:13px;color:var(--muted);margin-top:8px}
.delta-up{color:var(--ok)} .delta-down{color:var(--bad)}

/* foglio laterale */
.sheet-back{position:fixed;inset:0;background:rgba(10,8,10,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.sheet h2{font-size:22px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{width:100%}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
.addlist{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
.addlist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.addlist label:last-child{border-bottom:0}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:18px;margin-bottom:6px}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);z-index:30;max-width:calc(100% - 32px);font-size:14px}
.ro .w{display:none!important}
@media (max-width:560px){.brand h1{font-size:23px}.frow{grid-template-columns:110px minmax(0,1fr) 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <small>Associazione Stand Florio ETS</small>
      <h1>Rubrica contatti e inviti</h1>
    </div>
    <div class="evbar">
      <label for="evsel">Evento</label>
      <select id="evsel"></select>
      <span class="countdown" id="countdown"></span>
    </div>
  </header>
  <div class="toolbar" id="local-bar" hidden style="margin-top:12px">
    <span class="hint grow">I dati sono salvati in questo browser. Esporta un backup periodicamente o per trasferirli su un altro computer.</span>
    <button class="btn small" data-act="backup-export">Esporta backup</button>
    <label class="btn small" for="backup-in">Ripristina backup</label><input type="file" id="backup-in" accept=".json,application/json" hidden>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="report">Report settimanale</button>
    <button role="tab" data-tab="inviti">Inviti<span class="n" id="n-inviti">0</span></button>
    <button role="tab" data-tab="contatti">Contatti<span class="n" id="n-contatti">0</span></button>
    <button role="tab" data-tab="eventi">Eventi<span class="n" id="n-eventi">0</span></button>
  </nav>
  <div id="notice"></div>
  <main id="view"><div class="empty"><strong>Caricamento della rubrica…</strong>I contatti e lo stato degli inviti compariranno qui.</div></main>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
const CATS=[
 {k:"giornalisti",l:"Giornalisti e testate"},
 {k:"istituzioni",l:"Istituzioni e PA"},
 {k:"associazioni",l:"Associazioni di categoria"},
 {k:"imprese",l:"Imprese del territorio"},
 {k:"operatori",l:"Operatori turistici, culturali, enogastronomici"},
 {k:"altri",l:"Professionisti, università, fondazioni"}
];
const STATI=[
 {k:"da_invitare",l:"Da invitare"},
 {k:"invitato",l:"Invitato · in attesa"},
 {k:"sollecitato",l:"Sollecitato · in attesa"},
 {k:"confermato",l:"Confermato"},
 {k:"rifiutato",l:"Rifiutato"}
];
const RUOLI=["Ospite","Relatore","Moderatore","Azienda partner","Stampa","Istituzione"];
const PROVENIENZE=["Contatto diretto","Contatto aziendale (trovato su internet)","Rubrica Stand Florio","Rubrica Servizitalia","Evento precedente","Segnalazione","Ricerca stampa","Relazione progettuale","Importazione CSV"];
const DEF_SETTINGS={tasso:35,soglia:7,targetMin:120,targetMax:150};

const S={db:null,canWrite:true,contacts:[],events:[],invites:[],reports:[],settings:{...DEF_SETTINGS},
  loaded:{contacts:false,events:false,invites:false},eventId:null,tab:"report",q:"",cat:"",stato:"",pendingRender:false};
const catLabel=k=>(CATS.find(c=>c.k===k)||{l:"—"}).l;
const statoLabel=k=>(STATI.find(s=>s.k===k)||{l:k}).l;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function days(a,b){if(!a||!b)return null;const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5)}
function fmt(s,long){if(!s)return"—";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("it-IT",long?{day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"short"})}
function fullName(c){return [c.nome,c.cognome].filter(Boolean).join(" ")||c.organizzazione||"(senza nome)"}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function toast(m){const r=$("#toast-root");r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML="",3200)}
function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"Non hai i permessi per modificare la rubrica.";if(c==="quota_exceeded")return"Spazio del database esaurito: elimina contatti non più utili.";if(c==="resource_exhausted")return"Troppe modifiche ravvicinate: riprova tra qualche secondo.";return"Modifica non salvata. Riprova."}
async function w(fn){try{await fn();return true}catch(e){if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await fn();return true}catch(e2){toast(errMsg(e2));return false}}toast(errMsg(e));return false}}
const invId=(ev,c)=>ev+"__"+c;
function invitesFor(ev){return S.invites.filter(i=>i.eventId===ev)}
function contactById(id){return S.contacts.find(c=>c.id===id)}
function eventById(id){return S.events.find(e=>e.id===id)}
function curEvent(){return eventById(S.eventId)}

/* ---------- calcoli report ---------- */
function stats(ev){
  const set=S.settings, today=todayStr();
  const inv=invitesFor(ev).filter(i=>contactById(i.contactId));
  const of=k=>inv.filter(i=>i.stato===k);
  const conf=of("confermato"),rif=of("rifiutato"),attesa=inv.filter(i=>i.stato==="invitato"||i.stato==="sollecitato");
  const inviati=inv.filter(i=>i.stato!=="da_invitare");
  const accomp=conf.reduce((a,i)=>a+(+i.accompagnatori||0),0);
  const persConf=conf.length+accomp;
  const quota=Math.round(attesa.length*(+set.tasso||0)/100);
  const solleciti=attesa.map(i=>{const ref=i.stato==="sollecitato"?i.dataSollecito:i.dataInvito;const d=days(ref,today);return{i,d,ref}})
    .filter(x=>x.ref==null||x.d>=(+set.soglia||7)).sort((a,b)=>(b.d??999)-(a.d??999));
  const perCat=CATS.map(c=>{const r=inv.filter(i=>(contactById(i.contactId)||{}).categoria===c.k);return{c,tot:r.length,inviati:r.filter(i=>i.stato!=="da_invitare").length,conf:r.filter(i=>i.stato==="confermato").length,attesa:r.filter(i=>i.stato==="invitato"||i.stato==="sollecitato").length,rif:r.filter(i=>i.stato==="rifiutato").length}});
  return{inv,individuati:inv.length,daInvitare:of("da_invitare").length,inviati:inviati.length,risposte:conf.length+rif.length,conf:conf.length,rif:rif.length,attesa:attesa.length,accomp,persConf,quota,stima:persConf+quota,solleciti,perCat,sollecitati:of("sollecitato").length};
}

/* ---------- rendering ---------- */
function requestRender(){const a=document.activeElement;if(a&&a.closest&&a.closest("#view,.sheet")&&a.matches("input:not([type=checkbox]),textarea")){if(!S.pendingRender){S.pendingRender=true;a.addEventListener("blur",()=>{S.pendingRender=false;render()},{once:true})}return}render()}
function render(){
  document.getElementById("app").classList.toggle("ro",!S.canWrite);
  const evs=[...S.events].sort((a,b)=>(a.data||"").localeCompare(b.data||""));
  const sel=$("#evsel");
  sel.innerHTML=evs.length?evs.map(e=>`<option value="${esc(e.id)}"${e.id===S.eventId?" selected":""}>${esc(e.nome)} · ${fmt(e.data)}</option>`).join(""):`<option>Nessun evento</option>`;
  const ev=curEvent(),cd=$("#countdown");
  if(ev&&ev.data){const d=days(todayStr(),ev.data);cd.hidden=false;cd.className="countdown"+(d<0?" past":"");cd.textContent=d>1?`mancano ${d} giorni`:d===1?"domani":d===0?"oggi":`concluso il ${fmt(ev.data)}`}else cd.hidden=true;
  $("#n-inviti").textContent=ev?invitesFor(ev.id).length:0;
  $("#n-contatti").textContent=S.contacts.length;
  $("#n-eventi").textContent=S.events.length;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===S.tab));
  const v=$("#view");
  if(!S.db){return}
  if(!S.loaded.contacts||!S.loaded.events||!S.loaded.invites){v.innerHTML=`<div class="empty"><strong>Caricamento della rubrica…</strong>I contatti e lo stato degli inviti compariranno qui.</div>`;return}
  const old=v.querySelector(".tbl-wrap.scroll"),pos=old?{id:old.id,l:old.scrollLeft,t:old.scrollTop}:null;
  v.innerHTML=({report:viewReport,inviti:viewInviti,contatti:viewContatti,eventi:viewEventi}[S.tab]||viewReport)();
  const nw=v.querySelector(".tbl-wrap.scroll");if(pos&&nw&&nw.id===pos.id){nw.scrollLeft=pos.l;nw.scrollTop=pos.t}
}

function noEvent(){return`<div class="empty"><strong>Nessun evento registrato</strong>Crea il primo evento nella scheda Eventi per iniziare a tracciare gli inviti.</div>`}

function viewReport(){
  const ev=curEvent(); if(!ev)return noEvent();
  const s=stats(ev.id),set=S.settings,today=todayStr(),dd=days(today,ev.data);
  const max=Math.max(s.individuati,1);
  const tMax=+set.targetMax||150,tMin=+set.targetMin||120;
  const hist=S.reports.filter(r=>r.eventId===ev.id).sort((a,b)=>b.data.localeCompare(a.data));
  const prev=hist.find(r=>r.data<today);
  const delta=(k)=>{if(!prev)return"";const d=s[k]-(prev[k]||0);return d? ` <span class="${d>0?"delta-up":"delta-down"}">${d>0?"+":""}${d}</span>`:""};
  return`
  <div class="report-head">
    <div><h2>${esc(ev.nome)} · stato inviti al ${fmt(today,true)}</h2>

        <label for="set-soglia">Sollecito dopo (giorni)<input id="set-soglia" type="number" min="1" max="30" value="${esc(set.soglia)}" data-set="soglia"></label>
        <label for="set-tmin">Obiettivo minimo<input id="set-tmin" type="number" min="0" value="${esc(set.targetMin)}" data-set="targetMin"></label>
        <label for="set-tmax">Obiettivo massimo<input id="set-tmax" type="number" min="0" value="${esc(set.targetMax)}" data-set="targetMax"></label>
      </div>
    </section>

      ${s.solleciti.length?`<ul class="plain">${s.solleciti.map(x=>{const c=contactById(x.i.contactId);return`<li><span><strong>${esc(fullName(c))}</strong><span class="hint"> · ${esc(c.organizzazione||catLabel(c.categoria))}</span><br><span class="hint">${x.i.stato==="sollecitato"?"già sollecitato il "+fmt(x.ref)+": secondo sollecito":x.ref?"invitato il "+fmt(x.ref):"data d'invito non registrata"}</span></span><span class="num" style="white-space:nowrap">${x.d!=null?x.d+" gg":""} <button class="btn small w" data-act="mark-sollecito" data-id="${esc(x.i.id)}">Segna sollecitato</button></span></li>`}).join("")}</ul>`
      :`<p class="hint">Nessun sollecito in scadenza. Compaiono qui gli invitati senza risposta da almeno ${set.soglia} giorni.</p>`}

  </section>

    ${hist.map(r=>`<tr><td>${fmt(r.data,true)}</td><td>${r.individuati}</td><td>${r.inviati}</td><td>${r.risposte}</td><td>${r.conf}</td><td>${r.rif}</td><td>${r.attesa}</td><td>${r.solleciti}</td><td>${r.stima}</td></tr>`).join("")}
    </tbody></table></div>`:`<p class="hint">Ancora nessun report salvato. Ogni settimana premi «Salva report della settimana» per fissare i numeri e confrontarli con la settimana precedente.</p>`}
  </section>`;

function frow(l,v,max,cls){const p=Math.min(100,Math.round(v/Math.max(max,1)*100));return`<div class="frow"><span>${l}</span><div class="fbar"><span class="${cls||""}" style="width:${p}%"></span></div><span class="v">${v}</span></div>`}

function viewInviti(){
  const ev=curEvent(); if(!ev)return noEvent();
  const all=invitesFor(ev.id).filter(i=>contactById(i.contactId));
  const counts=Object.fromEntries(STATI.map(s=>[s.k,all.filter(i=>i.stato===s.k).length]));

  const order=["sollecitato","invitato","da_invitare","confermato","rifiutato"];
  rows.sort((a,b)=>order.indexOf(a.stato)-order.indexOf(b.stato)||fullName(contactById(a.contactId)).localeCompare(fullName(contactById(b.contactId))));

    <td><select class="stsel st-${esc(i.stato)}" data-f="stato" aria-label="Stato invito" ${S.canWrite?"":"disabled"}>${STATI.map(s=>`<option value="${s.k}"${s.k===i.stato?" selected":""}>${s.l}</option>`).join("")}</select></td>

   </tr>`}).join("")}

  <p class="hint" style="margin-top:10px">Cambiando lo stato la data corrispondente si compila con la data di oggi, se vuota. Spuntando «Presente» l'evento viene registrato nello storico partecipazioni del contatto.</p>`
  :`<div class="tbl-wrap"><div class="empty"><strong>Nessun contatto nel piano inviti</strong>Aggiungi i contatti della rubrica da invitare a «${esc(ev.nome)}».</div></div>`}`;

async function saveContact(){
  const f=$("#c-form"),id=f.dataset.id;
  const data={nome:$("#c-nome").value.trim(),cognome:$("#c-cognome").value.trim(),organizzazione:$("#c-org").value.trim(),ruolo:$("#c-ruolo").value.trim(),
    email:$("#c-email").value.trim(),telefono:$("#c-tel").value.trim(),categoria:$("#c-cat").value,provenienza:$("#c-prov").value.trim(),note:$("#c-note").value.trim(),
    eventi:[...document.querySelectorAll('input[name="c-ev"]:checked')].map(x=>x.value),aggiornato:todayStr()};
  if(!data.nome&&!data.cognome&&!data.organizzazione){$("#c-err").hidden=false;return}
  if(data.email&&S.contacts.some(c=>c.id!==id&&(c.email||"").toLowerCase()===data.email.toLowerCase())){toast("Esiste già un contatto con questa email.");return}
  const ok=await w(async()=>{if(id)await S.db.collection("contacts").doc(id).update(data);else{data.creato=todayStr();await S.db.collection("contacts").doc().set(data)}});
  if(ok){closeSheet();toast(id?"Contatto aggiornato":"Contatto aggiunto")}
}

  openSheet(`<h2>Aggiungi a «${esc(ev.nome)}»</h2>

  <div class="addlist" id="add-list">${avail.length?avail.map(c=>`<label data-cat="${esc(c.categoria)}" data-txt="${esc((fullName(c)+" "+(c.organizzazione||"")).toLowerCase())}"><input type="checkbox" name="add-c" value="${esc(c.id)}"><span><strong>${esc(fullName(c))}</strong><span class="hint"> · ${esc(c.organizzazione||"")}</span><br><span class="cat">${esc(catLabel(c.categoria))}</span></span></label>`).join(""):`<div class="empty">Tutti i contatti della rubrica sono già nel piano inviti.</div>`}</div>

function filterAdd(){const q=($("#add-q").value||"").toLowerCase(),cat=$("#add-cat").value;document.querySelectorAll("#add-list label").forEach(l=>{l.hidden=!((!cat||l.dataset.cat===cat)&&(!q||l.dataset.txt.includes(q)))})}

}

/* ---------- aggiornamenti inviti ---------- */
async function updateInvite(id,field,el){
  const inv=S.invites.find(i=>i.id===id); if(!inv)return;
  const patch={};
  if(field==="presente")patch.presente=el.checked;
  else if(field==="accompagnatori")patch.accompagnatori=Math.max(0,parseInt(el.value)||0);
  else patch[field]=el.value;
  if(field==="stato"){const t=todayStr();if(el.value==="invitato"&&!inv.dataInvito)patch.dataInvito=t;if(el.value==="sollecitato"){if(!inv.dataSollecito)patch.dataSollecito=t;if(!inv.dataInvito)patch.dataInvito=t}if((el.value==="confermato"||el.value==="rifiutato")&&!inv.dataRisposta)patch.dataRisposta=t}
  if((inv[field]??"")===patch[field]&&Object.keys(patch).length===1)return;
  const ok=await w(()=>S.db.collection("invites").doc(id).update(patch));
  if(ok&&field==="presente"){const c=contactById(inv.contactId);if(c){const evs=new Set(c.eventi||[]);el.checked?evs.add(inv.eventId):evs.delete(inv.eventId);await w(()=>S.db.collection("contacts").doc(c.id).update({eventi:[...evs]}))}}
}

/* ---------- CSV ---------- */
function csvCell(v){v=String(v??"");return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function saveFile(name,text,mime){
  const dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;
  if(dl){try{await dl.save({filename:name,data:text});toast("File pronto")}catch(e){if(e&&e.code!=="declined")toast("Download non riuscito.")}return}
  try{const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){toast("Download non riuscito.")}
}
function download(name,rows){return saveFile(name,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),"text/csv;charset=utf-8")}
function csvContatti(){const rows=[["Nome","Cognome","Organizzazione","Ruolo","Email","Telefono","Categoria","Provenienza","Eventi partecipati","Note"]];
  S.contacts.forEach(c=>rows.push([c.nome,c.cognome,c.organizzazione,c.ruolo,c.email,c.telefono,catLabel(c.categoria),c.provenienza,(c.eventi||[]).map(id=>{const e=eventById(id);return e?e.nome+" ("+e.data+")":""}).filter(Boolean).join(" | "),c.note]));
  download("rubrica-stand-florio-"+todayStr()+".csv",rows)}
function csvInviti(){const ev=curEvent();if(!ev)return;const rows=[["Nome","Cognome","Organizzazione","Categoria","Email","Telefono","Ruolo nell'evento","Stato","Data invito","Data sollecito","Data risposta","Accompagnatori","Presente","Note"]];
  invitesFor(ev.id).forEach(i=>{const c=contactById(i.contactId);if(c)rows.push([c.nome,c.cognome,c.organizzazione,catLabel(c.categoria),c.email,c.telefono,i.ruoloEvento,statoLabel(i.stato),i.dataInvito,i.dataSollecito,i.dataRisposta,i.accompagnatori||0,i.presente?"sì":"",i.note])});
  download("inviti-"+ev.id+"-"+todayStr()+".csv",rows)}
function parseCSV(text){
  text=text.replace(/^﻿/,"");const first=text.split(/\r?\n/)[0]||"";const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true; else if(ch===sep){row.push(cell);cell=""} else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""} else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
async function importCSV(file){
  const rows=parseCSV(await file.text()); if(rows.length<2){toast("Il file non contiene righe di contatti.");return}
  const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  const map={nome:["nome","name"],cognome:["cognome","surname","lastname"],organizzazione:["organizzazione","ente","azienda","testata","societa"],ruolo:["ruolo","qualifica","carica"],email:["email","mail","posta"],telefono:["telefono","tel","cellulare","cell"],categoria:["categoria","category"],provenienza:["provenienza","fonte","origine"],note:["note","notes"]};
  const head=rows[0].map(norm),idx={};for(const k in map){idx[k]=head.findIndex(h=>map[k].includes(h))}
  if(idx.nome<0&&idx.organizzazione<0&&idx.email<0){toast("Intestazioni non riconosciute: servono almeno nome, organizzazione o email.");return}
  const emails=new Set(S.contacts.map(c=>(c.email||"").toLowerCase()).filter(Boolean));
  const catOf=v=>{const n=norm(v||"");if(!n)return"altri";const hit=CATS.find(c=>c.k===n||norm(c.l).includes(n)||n.includes(c.k.slice(0,6)));return hit?hit.k:"altri"};
  let ok=0,skip=0;
  for(const r of rows.slice(1)){const g=k=>idx[k]>=0?(r[idx[k]]||"").trim():"";
    const d={nome:g("nome"),cognome:g("cognome"),organizzazione:g("organizzazione"),ruolo:g("ruolo"),email:g("email"),telefono:g("telefono"),categoria:catOf(g("categoria")),provenienza:g("provenienza")||"Importazione CSV",note:g("note"),eventi:[],creato:todayStr(),aggiornato:todayStr()};
    if(!d.nome&&!d.cognome&&!d.organizzazione&&!d.email)continue;
    if(d.email&&emails.has(d.email.toLowerCase())){skip++;continue}
    const res=await w(()=>S.db.collection("contacts").doc().set(d)); if(!res)break; ok++; if(d.email)emails.add(d.email.toLowerCase());
  }
  toast(`Importati ${ok} contatti${skip?`, ${skip} saltati perché già presenti`:""}`);
}

Contatti individuati: ${s.individuati} (di cui ${s.daInvitare} ancora da invitare)

/* ---------- archivio locale: usato quando la pagina è aperta fuori da Claude ---------- */
function makeLocalDB(seed){
  const KEY="sf-rubrica-dati-v1";
  const clone=o=>JSON.parse(JSON.stringify(o));
  let data=null;try{data=JSON.parse(localStorage.getItem(KEY))}catch(_){}
  if(!data||typeof data!=="object"||!data.contacts)data=clone(seed);
  const listeners=[];
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(_){}};
  const notify=()=>listeners.slice().forEach(l=>l());
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const snap=(id,b)=>({id,exists:!!b,data:()=>b?clone(b):undefined});
  const listen=(emit)=>{listeners.push(emit);setTimeout(emit,0);return()=>{const i=listeners.indexOf(emit);if(i>=0)listeners.splice(i,1)}};
  function docRef(col,id){return{id,
    async get(){return snap(id,(data[col]||{})[id])},
    async set(v){(data[col]=data[col]||{})[id]=clone(v);persist();notify()},
    async update(v){const c=data[col]||{};if(!c[id])throw{code:"invalid_argument",message:"Documento inesistente"};c[id]={...c[id],...clone(v)};persist();notify()},
    async delete(){if(data[col])delete data[col][id];persist();notify()},
    onSnapshot(fn){return listen(()=>fn(snap(id,(data[col]||{})[id])))}}}
  function colRef(col){return{
    doc:id=>docRef(col,id||uid()),
    onSnapshot(fn){return listen(()=>{const docs=Object.entries(data[col]||{}).map(([id,b])=>snap(id,b));fn({docs,size:docs.length,empty:!docs.length})})}}}
  window.addEventListener("storage",e=>{if(e.key===KEY){try{const d=JSON.parse(e.newValue);if(d&&d.contacts){data=d;notify()}}catch(_){}}});
  return{local:true,collection:colRef,doc:p=>{const [c,i]=p.split("/");return docRef(c,i)},
    exportData:()=>clone(data),importData:d=>{data=clone(d);persist();notify()}};
}

  const h=(location.hash||"").slice(1);if(["report","inviti","contatti","eventi"].includes(h))S.tab=h;

  S.db=db;

  sub("contacts","contacts");sub("events","events");sub("invites","invites");sub("reports","reports");
  db.doc("settings/main").onSnapshot(d=>{S.settings={...DEF_SETTINGS,...(d.exists?d.data():{})};requestRender()},()=>{});
})();
