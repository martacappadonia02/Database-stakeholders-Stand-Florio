<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rubrica Stand Florio</title>
<style>
/* Layout: barra evento in alto, quattro schede (Report · Inviti · Contatti · Eventi), tabelle operative a tutta larghezza */
:root{
  --bg:#F4F4F1; --surface:#FFFFFF; --sunk:#ECEBE7; --ink:#1E1A1B; --muted:#6A6265; --line:#DEDAD6;
  --marsala:#7B1E2E; --marsala-soft:#F4E5E8; --sole:#F2C618; --sole-ink:#3B2A00; --tonno:#2D4A7C; --tonno-soft:#E4EAF4;
  --ok:#2C7448; --ok-soft:#E1F0E6; --warn:#9A5B00; --warn-soft:#FBEED6; --bad:#A1302B; --bad-soft:#F8E1DF; --idle:#6A6265; --idle-soft:#ECEBE7;
  --f-display:"Futura","Century Gothic","Avenir Next","Trebuchet MS",system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13161C; --surface:#1B1F27; --sunk:#232833; --ink:#ECE9E5; --muted:#A49EA0; --line:#2F3440;
  --marsala:#E48B9B; --marsala-soft:#3A2329; --sole:#F2C618; --sole-ink:#2A1E00; --tonno:#94B3E8; --tonno-soft:#232E44;
  --ok:#72C493; --ok-soft:#1E3326; --warn:#E6A94E; --warn-soft:#3A2D16; --bad:#F08479; --bad-soft:#3D2220; --idle:#A49EA0; --idle-soft:#262A33;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13161C; --surface:#1B1F27; --sunk:#232833; --ink:#ECE9E5; --muted:#A49EA0; --line:#2F3440;
  --marsala:#E48B9B; --marsala-soft:#3A2329; --sole:#F2C618; --sole-ink:#2A1E00; --tonno:#94B3E8; --tonno-soft:#232E44;
  --ok:#72C493; --ok-soft:#1E3326; --warn:#E6A94E; --warn-soft:#3A2D16; --bad:#F08479; --bad-soft:#3D2220; --idle:#A49EA0; --idle-soft:#262A33;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tonno);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* testata */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:2px solid var(--marsala)}
.brand small{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.18em;font-size:12px;color:var(--muted)}
.brand h1{font-size:28px;letter-spacing:.01em}
.evbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.evbar label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.evbar select{max-width:280px}
.countdown{background:var(--sole);color:var(--sole-ink);font-family:var(--f-display);font-weight:600;padding:6px 12px;border-radius:999px;font-size:14px;white-space:nowrap}
.countdown.past{background:var(--sunk);color:var(--muted)}

/* schede */
nav.tabs{display:flex;gap:4px;margin:18px 0 22px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-family:var(--f-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--marsala);border-bottom-color:var(--marsala)}
nav.tabs .n{font-family:var(--f-body);font-size:12px;background:var(--sunk);border-radius:999px;padding:1px 7px;margin-left:6px;color:var(--muted)}

/* controlli */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--marsala);border-color:var(--marsala);color:var(--surface)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
input[type=text],input[type=email],input[type=tel],input[type=search],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;min-width:0}
textarea{width:100%;min-height:80px;resize:vertical}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1 1 220px}
.toolbar input[type=search]{width:100%}
.hint{color:var(--muted);font-size:13px}

/* tabelle */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
/* elenchi lunghi: area con altezza fissa, così la barra di scorrimento orizzontale resta sempre visibile */
.tbl-wrap.scroll{overflow:auto;max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);min-height:260px;overscroll-behavior:contain}
.tbl-wrap.scroll table{border-collapse:separate;border-spacing:0}
.tbl-wrap.scroll thead th{position:sticky;top:0;z-index:2}
@media (min-width:700px){
  .tbl-wrap.scroll th:first-child,.tbl-wrap.scroll td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--line);min-width:220px}
  .tbl-wrap.scroll thead th:first-child{z-index:3;background:var(--sunk)}
}
.scroll-nav{display:flex;gap:6px;align-items:center}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--sunk);white-space:nowrap}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--muted);font-size:13px}
td.c{text-align:center}
td input[type=date]{width:140px;padding:4px 6px}
td input[type=number]{width:60px;padding:4px 6px}
td select{padding:4px 6px}
td input.note{width:200px;padding:4px 6px}
.copyable{user-select:all;word-break:break-all}

/* stati */
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st-da_invitare{background:var(--idle-soft);color:var(--idle)}
.st-invitato{background:var(--tonno-soft);color:var(--tonno)}
.st-sollecitato{background:var(--warn-soft);color:var(--warn)}
.st-confermato{background:var(--ok-soft);color:var(--ok)}
.st-rifiutato{background:var(--bad-soft);color:var(--bad)}
select.stsel{font-weight:600;border-radius:999px}
.cat{display:inline-block;font-size:12px;padding:2px 8px;border-radius:4px;background:var(--marsala-soft);color:var(--marsala);white-space:nowrap}
.evchip{display:inline-block;font-size:12px;padding:1px 7px;border:1px solid var(--line);border-radius:4px;margin:0 4px 4px 0;white-space:nowrap}
.flag{color:var(--warn);font-weight:600;font-size:12px;display:block}

/* filtri stato */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* report */
.report-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
.report-head h2{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .lab{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.kpi .val{font-family:var(--f-display);font-size:34px;font-weight:500;line-height:1.1;margin-top:4px}
.kpi .det{font-size:13px;color:var(--muted);margin-top:4px}
.kpi.hero{border-color:var(--marsala);background:var(--marsala-soft)}
.kpi.hero .val{color:var(--marsala)}
.kpi.alert .val{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-bottom:22px}
@media (max-width:820px){.grid2{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.panel h3{font-size:16px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;color:var(--marsala)}
.funnel{display:grid;gap:10px}
.frow{display:grid;grid-template-columns:150px minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:14px}
.fbar{height:14px;background:var(--sunk);border-radius:3px;overflow:hidden}
.fbar span{display:block;height:100%;background:var(--tonno)}
.fbar span.ok{background:var(--ok)}
.fbar span.target{background:var(--marsala)}
.frow .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.settings{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.settings label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.settings input{width:90px}
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{padding:7px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
ul.plain li:last-child{border-bottom:0}
.formula{font-size:13px;color:var(--muted);margin-top:8px}
.delta-up{color:var(--ok)} .delta-down{color:var(--bad)}

/* foglio laterale */
.sheet-back{position:fixed;inset:0;background:rgba(10,8,10,.45);z-index:20}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));border-left:1px solid var(--line)}
.sheet h2{font-size:22px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.form label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.form input,.form select{width:100%}
@media (max-width:480px){.form{grid-template-columns:1fr}}
.checks{display:grid;gap:6px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.sheet-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;margin-top:20px}
/* nome cliccabile che apre l'anagrafica */
.namelink{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--marsala);text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px;transition:text-decoration-color .15s}
.namelink:hover,.namelink:focus-visible{text-decoration-color:currentColor}
/* codice identificativo e controlli */
.code{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--tonno);background:var(--tonno-soft);border-radius:4px;padding:1px 6px;margin-right:8px;vertical-align:1px}
h2 .code{font-size:14px;vertical-align:3px}
.chk-ok{background:var(--ok-soft);color:var(--ok)}
.chk-warn{background:var(--warn-soft);color:var(--warn)}
.chk-bad{background:var(--bad-soft);color:var(--bad)}
.flag.bad{color:var(--bad)}
.clamp{display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.checks-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 16px}
.checks-row .hint{margin-right:4px}
.fsec{border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;background:var(--surface)}
.fsec>summary{cursor:pointer;padding:10px 12px;font-family:var(--f-display);font-weight:500;text-transform:uppercase;letter-spacing:.06em;font-size:13px;color:var(--marsala);list-style-position:inside}
.fsec>.form{padding:4px 12px 14px}
.form input[readonly]{background:var(--sunk);color:var(--muted)}
.ro-h{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--marsala);margin:20px 0 6px}
.ro-grid dd a{color:var(--tonno);overflow-wrap:anywhere}
/* scheda anagrafica in sola lettura */
.ro-sub{color:var(--muted);margin:-10px 0 18px}
.ro-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:0;margin:0;border-top:1px solid var(--line)}
.ro-grid dt,.ro-grid dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line)}
.ro-grid dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding-right:12px}
.ro-grid dd{min-width:0;overflow-wrap:anywhere;white-space:pre-line}
.ro-grid dd.empty-v{color:var(--muted)}
.ro-inv{display:grid;gap:6px}
@media (max-width:480px){.ro-grid{grid-template-columns:1fr}.ro-grid dt{padding-bottom:0;border-bottom:0}}
/* selezione multipla contatti */
.selcell{display:flex;gap:10px;align-items:flex-start}
.selcell input[type=checkbox],th .selcell input[type=checkbox]{width:17px;height:17px;margin:1px 0 0;flex:none;cursor:pointer;accent-color:var(--marsala)}
tr.is-sel td{background:var(--marsala-soft)}
@media (min-width:700px){.tbl-wrap.scroll tr.is-sel td:first-child{background:var(--marsala-soft)}}
.bulkbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1px solid var(--marsala);border-radius:var(--r);background:var(--marsala-soft)}
.bulkbar .count{font-weight:700;color:var(--marsala);margin-right:4px}
.bulkbar .grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.bulkbar select{padding:5px 8px}
.bulkbar .sep{width:1px;align-self:stretch;background:var(--line)}
@media (max-width:640px){.bulkbar .sep{display:none}}
.addlist{max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);margin:10px 0}
.addlist label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.addlist label:last-child{border-bottom:0}

.empty{padding:36px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--f-display);font-weight:500;font-size:18px;margin-bottom:6px}
.notice{padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--warn);margin-bottom:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:var(--r);z-index:30;max-width:calc(100% - 32px);font-size:14px}
.ro .w{display:none!important}
@media (max-width:560px){.brand h1{font-size:23px}.frow{grid-template-columns:110px minmax(0,1fr) 40px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <small>Associazione Stand Florio ETS</small>
      <h1>Rubrica contatti e inviti</h1>
    </div>
    <div class="evbar">
      <label for="evsel">Evento</label>
      <select id="evsel"></select>
      <span class="countdown" id="countdown"></span>
    </div>
  </header>
    <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="report">Report settimanale</button>
    <button role="tab" data-tab="inviti">Inviti<span class="n" id="n-inviti">0</span></button>
    <button role="tab" data-tab="contatti">Contatti<span class="n" id="n-contatti">0</span></button>
    <button role="tab" data-tab="eventi">Eventi<span class="n" id="n-eventi">0</span></button>
  </nav>
  <div id="notice"></div>
  <main id="view"><div class="empty"><strong>Caricamento della rubrica…</strong>I contatti e lo stato degli inviti compariranno qui.</div></main>
</div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
/* ---------- struttura dell'anagrafica (rubrica del cerimoniale, 20 ottobre 2026) ---------- */
const CATALOGO=[{"k": "Stampa", "sub": ["Televisioni", "Radio", "Quotidiani", "Testate online", "Periodici e riviste", "Agenzie di stampa", "Giornalisti freelance", "Fotogiornalisti e videoreporter"]}, {"k": "Autorità amministrative", "sub": ["Comune – Sindaco e Gabinetto", "Comune – Assessorati", "Comune – Consiglio comunale", "Città metropolitana", "Provincia / Libero consorzio", "Circoscrizioni", "Regione – Presidenza e Assessorati", "Assemblea regionale", "Parlamento e Governo", "Enti pubblici e agenzie"]}, {"k": "Autorità civili e sicurezza", "sub": ["Prefettura", "Questura e Polizia di Stato", "Carabinieri", "Guardia di Finanza", "Capitaneria di porto", "Vigili del Fuoco", "Polizia municipale", "Autorità giudiziarie"]}, {"k": "Autorità religiose", "sub": ["Arcidiocesi e Diocesi", "Parrocchie del territorio", "Comunità religiose"]}, {"k": "Associazioni e territorio", "sub": ["Associazioni culturali", "Associazioni di quartiere", "Comitati civici e residenti", "ETS e volontariato sociale", "Associazioni ambientali", "Associazioni sportive", "Pro loco", "Service club"]}, {"k": "Rappresentanze economiche", "sub": ["Associazioni del commercio", "Associazioni industria e artigianato", "Associazioni agricole e pesca", "Consorzi e associazioni del vino", "Camera di commercio", "Ordini professionali", "Sindacati", "Cooperazione", "Ospitalità e ristorazione"]}, {"k": "Cultura e patrimonio", "sub": ["Fondazioni culturali", "Musei e archivi", "Soprintendenze e tutela", "Biblioteche", "Autori e scrittori", "Storici e studiosi del territorio", "Festival e operatori culturali"]}, {"k": "Università e formazione", "sub": ["Rettorato e governance", "Docenti e ricercatori", "Dipartimenti e centri di ricerca", "Istituti alberghieri", "Scuole del territorio", "Formazione professionale"]}, {"k": "Imprese e filiere", "sub": ["Cantine e produttori di vino", "Pesca, tonno e conserve", "Ristorazione e chef", "Produttori agroalimentari", "Commercio e artigianato", "Servizi e professionisti", "Banche e imprese finanziarie", "Distribuzione alimentare", "Architettura e progettazione"]}, {"k": "Turismo e ospitalità", "sub": ["Hotel e strutture ricettive", "Tour operator e agenzie", "Guide turistiche", "Reti e distretti turistici", "Operatori del turismo culturale", "Operatori del turismo enogastronomico"]}, {"k": "Comunicazione digitale", "sub": ["Creator enogastronomia", "Creator cultura e turismo", "Pagine di quartiere", "Blogger e podcaster", "Agenzie di comunicazione", "Grafica e progettazione visiva"]}];
const CATS=CATALOGO.map(c=>({k:c.k,l:c.k}));
const SUBCATS=Object.fromEntries(CATALOGO.map(c=>[c.k,c.sub]));
const TEMI=["Da definire", "Enogastronomia", "Vino e Marsala", "Tonno e cultura del mare", "Storia dei Florio", "Cultura e patrimonio", "Turismo", "Cronaca locale", "Rigenerazione urbana e costa", "Sociale e comunità", "Economia e imprese", "Istituzioni e politiche pubbliche"];
const TERRITORI=["Da definire", "Costa Sud / Romagnolo", "Brancaccio / Maredolce", "Settecannoli", "Sant’Erasmo", "Palermo città", "Area metropolitana Palermo", "Marsala", "Trapani e provincia", "Sicilia", "Italia", "Internazionale"];
const GRUPPI=[{k:"Base utente",p:"U"},{k:"Nuovo suggerimento",p:"S"}];
const LISTE={
  gruppo:GRUPPI.map(g=>g.k),
  priorita:["Alta","Media","Bassa","Da definire"],
  statoRecapiti:["Da reperire","Fornito; da verificare","Pubblicato; da riconfermare","Verificato","Non valido"],
  baseGiuridica:["Da valutare","Consenso","Legittimo interesse documentato","Altra base documentata"],
  consenso:["Non documentato","Acquisito","Negato","Revocato","Non applicabile"],
  informativa:["Da gestire","Fornita","Non applicabile documentato"],
  opposizione:["Da verificare","No","Sì"],
  approvazione:["Da valutare","Approvato","Non approvato"],
  verificaIdentita:["Da verificare","Da riconfermare","Verificata"],
  statoIndirizzo:["Da reperire","Pubblicato; da riconfermare","Confermato dalla segreteria","Non applicabile"],
  tema:TEMI,
  territorioSeguito:TERRITORI
};
/* Sezioni e campi della scheda: t = tipo di campo, full = a tutta larghezza */
const SEZIONI=[
 {id:"ident",l:"Identificazione",open:true,f:[
   {k:"codice",l:"ID",t:"code"},{k:"gruppo",l:"Gruppo",t:"select"},
   {k:"priorita",l:"Priorità proposta",t:"select"},{k:"referenteInterno",l:"Referente interno"},
   {k:"provenienza",l:"Provenienza del contatto",t:"prov",full:true}]},
 {id:"anag",l:"Anagrafica",open:true,f:[
   {k:"nome",l:"Nome"},{k:"cognome",l:"Cognome"},
   {k:"organizzazione",l:"Organizzazione",full:true},{k:"ruolo",l:"Ruolo",full:true},
   {k:"formulaSaluto",l:"Formula di saluto",full:true},
   {k:"fonteNominativo",l:"Fonte nominativo originale"},{k:"verificaIdentita",l:"Verifica identità",t:"select"}]},
 {id:"class",l:"Classificazione",open:true,f:[

/* Codice identificativo: lettera del gruppo (U = Base utente, S = Nuovo suggerimento) + progressivo a tre cifre.
   Il progressivo non viene mai riutilizzato, nemmeno dopo l'eliminazione di un contatto. */
function prefixOf(gruppo){return (GRUPPI.find(g=>g.k===gruppo)||GRUPPI[0]).p}
function nextCode(gruppo){
  const p=prefixOf(gruppo),mx=(S.settings.maxCodes||{})[p]||0;
  const used=S.contacts.map(c=>String(c.codice||"")).filter(x=>x[0]===p).map(x=>parseInt(x.slice(1))||0);
  const n=Math.max(mx,0,...used)+1;
  return{code:p+String(n).padStart(3,"0"),p,n};
}

/* Controlli calcolati, come nel file Excel */
const normEmail=e=>String(e||"").trim().toLowerCase();
const nameKey=c=>[c.nome,c.cognome,c.organizzazione].map(x=>String(x||"").trim()).join(" ").trim().toLowerCase();
function checkDuplicati(c){
  if(c.codice&&S.contacts.filter(x=>x.codice===c.codice).length>1)return"ID duplicato";
  const e=normEmail(c.email);if(e&&S.contacts.filter(x=>normEmail(x.email)===e).length>1)return"Email condivisa/duplicata";
  const k=nameKey(c);if(k&&S.contacts.filter(x=>nameKey(x)===k).length>1)return"Possibile omonimo";
  return"OK";
}
function checkPronto(c){
  if(c.opposizione==="Sì"||c.consenso==="Revocato"||c.consenso==="Negato")return"NON CONTATTARE";
  const ok=c.statoRecapiti==="Verificato"&&c.verificaIdentita==="Verificata"&&c.opposizione==="No"&&c.approvazione==="Approvato"&&
    c.baseGiuridica&&c.baseGiuridica!=="Da valutare"&&c.evidenzaBase&&(c.informativa==="Fornita"||c.informativa==="Non applicabile documentato")&&
    (c.email||c.telefono)&&(c.baseGiuridica!=="Consenso"||(c.consenso==="Acquisito"&&c.dataConsenso));
  return ok?"Verifiche completate":"Verifiche mancanti";
}
function checkCoerenza(c){return (SUBCATS[c.categoria]||[]).includes(c.sottocategoria)?"OK":"Rivedere sottocategoria"}

function days(a,b){if(!a||!b)return null;const pa=a.split("-").map(Number),pb=b.split("-").map(Number);return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5)}
function fmt(s,long){if(!s)return"—";const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("it-IT",long?{day:"numeric",month:"long",year:"numeric"}:{day:"numeric",month:"short"})}

function errMsg(e){const c=e&&e.code;if(c==="invalid_argument")return"Non hai i permessi per modificare la rubrica.";if(c==="quota_exceeded")return"Spazio del database esaurito: elimina contatti non più utili.";if(c==="resource_exhausted")return"Troppe modifiche ravvicinate: riprova tra qualche secondo.";return"Modifica non salvata. Riprova."}

/* ---------- calcoli report ---------- */
function stats(ev){
  const set=S.settings, today=todayStr();
  const inv=invitesFor(ev).filter(i=>contactById(i.contactId));
  const of=k=>inv.filter(i=>i.stato===k);
  const conf=of("confermato"),rif=of("rifiutato"),attesa=inv.filter(i=>i.stato==="invitato"||i.stato==="sollecitato");
  const inviati=inv.filter(i=>i.stato!=="da_invitare");
  const accomp=conf.reduce((a,i)=>a+(+i.accompagnatori||0),0);
  const persConf=conf.length+accomp;
  const quota=Math.round(attesa.length*(+set.tasso||0)/100);
  const solleciti=attesa.map(i=>{const ref=i.stato==="sollecitato"?i.dataSollecito:i.dataInvito;const d=days(ref,today);return{i,d,ref}})
    .filter(x=>x.ref==null||x.d>=(+set.soglia||7)).sort((a,b)=>(b.d??999)-(a.d??999));
  const perCat=CATS.map(c=>{const r=inv.filter(i=>(contactById(i.contactId)||{}).categoria===c.k);return{c,tot:r.length,inviati:r.filter(i=>i.stato!=="da_invitare").length,conf:r.filter(i=>i.stato==="confermato").length,attesa:r.filter(i=>i.stato==="invitato"||i.stato==="sollecitato").length,rif:r.filter(i=>i.stato==="rifiutato").length}});
  return{inv,individuati:inv.length,daInvitare:of("da_invitare").length,inviati:inviati.length,risposte:conf.length+rif.length,conf:conf.length,rif:rif.length,attesa:attesa.length,accomp,persConf,quota,stima:persConf+quota,solleciti,perCat,sollecitati:of("sollecitato").length};
}

async function bulkInvite(){
  const evId=($("#bulk-ev")||{}).value,st=($("#bulk-stato")||{}).value||"invitato";
  if(!evId||!eventById(evId)){toast("Scegli l'evento.");return}
  const already=new Set(invitesFor(evId).map(i=>i.contactId));
  const ids=[...S.sel].filter(id=>contactById(id));
  const todo=ids.filter(id=>!already.has(id));
  let n=0;
  for(const id of todo){const ok=await w(()=>S.db.collection("invites").doc(invId(evId,id)).set({eventId:evId,contactId:id,stato:st,ruoloEvento:"Ospite",dataInvito:st==="invitato"?todayStr():"",dataSollecito:"",dataRisposta:"",accompagnatori:0,presente:false,note:""}));if(ok)n++;else break}
  const skip=ids.length-todo.length;
  S.sel.clear();render();
  toast(`${n} ${n===1?"contatto aggiunto":"contatti aggiunti"} a «${eventById(evId).nome}»${skip?` · ${skip} già presenti, lasciati invariati`:""}`);
}
async function bulkDelete(btn){
  const ids=[...S.sel].filter(id=>contactById(id)); if(!ids.length)return;
  if(rmArmed!=="bulk"){rmArmed="bulk";btn.textContent=`Conferma: elimina ${ids.length}`;return}
  rmArmed=null;let n=0;
  for(const id of ids){
    let ok=true;for(const i of S.invites.filter(i=>i.contactId===id)){if(!await w(()=>S.db.collection("invites").doc(i.id).delete())){ok=false;break}}
    if(!ok||!await w(()=>S.db.collection("contacts").doc(id).delete()))break;n++;
  }
  S.sel.clear();render();
  toast(`${n} ${n===1?"contatto eliminato":"contatti eliminati"}, insieme ai rispettivi inviti`);
}

function fmtVal(f,v){
  if(!v)return"";
  if(f.t==="date")return esc(fmt(v,true));
  if(/^https?:\/\//i.test(v))return v.split(/\s*;\s*/).map(u=>/^https?:\/\//i.test(u)?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`:esc(u)).join("<br>");
  if(f.t==="email"||f.t==="tel")return`<span class="copyable">${esc(v)}</span>`;
  if(f.k==="categoria")return`<span class="cat">${esc(v)}</span>`;
  return esc(v);
}

function fieldInput(f,c,isNew){
  const id="c-"+f.k,v=c[f.k]??"";
  const lab=(inner)=>`<label class="${f.full?"full":""}" for="${id}">${esc(f.l)}${inner}</label>`;
  const opts=(list,cur,blank)=>(blank?`<option value="">—</option>`:"")+list.map(o=>`<option value="${esc(o)}"${o===cur?" selected":""}>${esc(o)}</option>`).join("")+(cur&&!list.includes(cur)?`<option value="${esc(cur)}" selected>${esc(cur)} (valore non in elenco)</option>`:"");
  switch(f.t){
    case"code":return lab(`<input type="text" id="${id}" value="${esc(isNew?"Assegnato al salvataggio":v)}" readonly>`);
    case"select":return lab(`<select id="${id}">${opts(LISTE[f.k]||[],v,!LISTE[f.k]||!LISTE[f.k].includes(v)&&!v)}</select>`);
    case"cat":return lab(`<select id="${id}">${opts(CATS.map(x=>x.k),v,true)}</select>`);
    case"subcat":return lab(`<select id="${id}">${opts(SUBCATS[c.categoria]||[],v,true)}</select>`);
    case"prov":return lab(`<input type="text" id="${id}" list="prov-list" value="${esc(v)}"><datalist id="prov-list">${PROVENIENZE.map(p=>`<option value="${esc(p)}">`).join("")}</datalist>`);
    case"area":return lab(`<textarea id="${id}">${esc(v)}</textarea>`);
    case"date":return lab(`<input type="date" id="${id}" value="${esc(v)}">`);
    case"email":return lab(`<input type="email" id="${id}" value="${esc(v)}">`);
    case"tel":return lab(`<input type="tel" id="${id}" value="${esc(v)}">`);
    default:return lab(`<input type="text" id="${id}" value="${esc(v)}">`);
  }
}

async function saveContact(){
  const f=$("#c-form"),id=f.dataset.id;
  const data={};
  CAMPI.forEach(fl=>{if(fl.t==="code")return;const el=document.getElementById("c-"+fl.k);if(el)data[fl.k]=el.value.trim()});
  data.eventi=[...document.querySelectorAll('input[name="c-ev"]:checked')].map(x=>x.value);
  data.aggiornato=todayStr();
  if(!data.nome&&!data.cognome&&!data.organizzazione){$("#c-err").hidden=false;$("#c-err").scrollIntoView({block:"nearest"});return}
  if(data.email&&S.contacts.some(c=>c.id!==id&&normEmail(c.email)===normEmail(data.email))){toast("Esiste già un contatto con questa email principale.");return}
  let ok;
  if(id){ok=await w(()=>S.db.collection("contacts").doc(id).update(data))}
  else{
    const nc=nextCode(data.gruppo);data.codice=nc.code;data.creato=todayStr();
    ok=await w(()=>S.db.collection("contacts").doc(nc.code.toLowerCase()).set(data));
    if(ok)await w(()=>S.db.doc("settings/main").set({...S.settings,maxCodes:{...(S.settings.maxCodes||{}),[nc.p]:nc.n}}));
  }
  if(ok){closeSheet();toast(id?"Contatto aggiornato":`Contatto aggiunto con ID ${data.codice}`)}
}

async function updateInvite(id,field,el){
  const inv=S.invites.find(i=>i.id===id); if(!inv)return;
  const patch={};
  if(field==="presente")patch.presente=el.checked;
  else if(field==="accompagnatori")patch.accompagnatori=Math.max(0,parseInt(el.value)||0);
  else patch[field]=el.value;
  if(field==="stato"){const t=todayStr();if(el.value==="invitato"&&!inv.dataInvito)patch.dataInvito=t;if(el.value==="sollecitato"){if(!inv.dataSollecito)patch.dataSollecito=t;if(!inv.dataInvito)patch.dataInvito=t}if((el.value==="confermato"||el.value==="rifiutato")&&!inv.dataRisposta)patch.dataRisposta=t}
  if((inv[field]??"")===patch[field]&&Object.keys(patch).length===1)return;
  const ok=await w(()=>S.db.collection("invites").doc(id).update(patch));
  if(ok&&field==="presente"){const c=contactById(inv.contactId);if(c){const evs=new Set(c.eventi||[]);el.checked?evs.add(inv.eventId):evs.delete(inv.eventId);await w(()=>S.db.collection("contacts").doc(c.id).update({eventi:[...evs]}))}}
}

/* ---------- CSV ---------- */
function csvCell(v){v=String(v??"");return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function saveFile(name,text,mime){
  const dl=(window.claude&&window.claude.use)?await window.claude.use("downloads"):null;
  if(dl){try{await dl.save({filename:name,data:text});toast("File pronto")}catch(e){if(e&&e.code!=="declined")toast("Download non riuscito.")}return}
  try{const url=URL.createObjectURL(new Blob([text],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}catch(e){toast("Download non riuscito.")}
}
function download(name,rows){return saveFile(name,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),"text/csv;charset=utf-8")}
function csvContatti(){
  const head=[...CAMPI.map(f=>f.l),"Eventi partecipati","Controllo duplicati","Pronto al contatto","Coerenza categoria"];
  const rows=[head];
  [...S.contacts].sort((a,b)=>String(a.codice||"").localeCompare(String(b.codice||""))).forEach(c=>rows.push([...CAMPI.map(f=>c[f.k]??""),

function csvInviti(){const ev=curEvent();if(!ev)return;const rows=[["ID","Nome","Cognome","Organizzazione","Categoria","Sottocategoria","Email principale","Telefono","Ruolo nell'evento","Stato","Data invito","Data sollecito","Data risposta","Accompagnatori","Presente","Note","Pronto al contatto"]];
  invitesFor(ev.id).forEach(i=>{const c=contactById(i.contactId);if(c)rows.push([c.codice,c.nome,c.cognome,c.organizzazione,c.categoria,c.sottocategoria,c.email,c.telefono,i.ruoloEvento,statoLabel(i.stato),i.dataInvito,i.dataSollecito,i.dataRisposta,i.accompagnatori||0,i.presente?"sì":"",i.note,checkPronto(c)])});
  download("inviti-"+ev.id+"-"+todayStr()+".csv",rows)}
function parseCSV(text){
  text=text.replace(/^﻿/,"");const first=text.split(/\r?\n/)[0]||"";const sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?";":",";
  const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true; else if(ch===sep){row.push(cell);cell=""} else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cell);rows.push(row);row=[];cell=""} else cell+=ch}
  if(cell||row.length){row.push(cell);rows.push(row)}
  return rows.filter(r=>r.some(c=>c.trim()));
}
async function importCSV(file){
  const rows=parseCSV(await file.text()); if(rows.length<2){toast("Il file non contiene righe di contatti.");return}
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z]/g,"");
  /* intestazioni riconosciute: le etichette della scheda più alcuni sinonimi */
  const syn={nome:["name"],cognome:["surname","lastname"],organizzazione:["ente","azienda","testata","societa"],ruolo:["qualifica","carica"],
    email:["email","mail","posta"],telefono:["tel","cellulare","cell"],categoria:["category"],provenienza:["origine"],note:["notes","note"],codice:["id","codice"]};
  const head=rows[0].map(norm),idx={};
  CAMPI.forEach(f=>{const names=[norm(f.l),norm(f.k),...(syn[f.k]||[])];idx[f.k]=head.findIndex(h=>names.includes(h))});
  if(idx.nome<0&&idx.organizzazione<0&&idx.email<0){toast("Intestazioni non riconosciute: servono almeno nome, organizzazione o email.");return}
  const emails=new Set(S.contacts.map(c=>normEmail(c.email)).filter(Boolean));
  const codes=new Set(S.contacts.map(c=>c.codice).filter(Boolean));
  let ok=0,skip=0;const maxCodes={...(S.settings.maxCodes||{})};
  for(const r of rows.slice(1)){
    const d={...DEFAULTS,provenienza:"Importazione CSV"};
    CAMPI.forEach(f=>{if(idx[f.k]>=0){const v=(r[idx[f.k]]||"").trim();if(v)d[f.k]=v}});
    if(!LISTE.gruppo.includes(d.gruppo))d.gruppo=DEFAULTS.gruppo;
    if(d.categoria&&!SUBCATS[d.categoria]){d.note=[d.note,"Categoria originale: "+d.categoria].filter(Boolean).join(" — ");d.categoria=""}
    if(!d.nome&&!d.cognome&&!d.organizzazione&&!d.email)continue;
    if(d.email&&emails.has(normEmail(d.email))){skip++;continue}
    if(!d.codice||codes.has(d.codice)||!/^[US]\d{3,}$/.test(d.codice)){
      const p=prefixOf(d.gruppo),used=[...codes].filter(x=>x[0]===p).map(x=>parseInt(x.slice(1))||0);
      const n=Math.max(maxCodes[p]||0,0,...used)+1;d.codice=p+String(n).padStart(3,"0");
    }
    const p=d.codice[0],n=parseInt(d.codice.slice(1))||0;maxCodes[p]=Math.max(maxCodes[p]||0,n);
    d.eventi=[];d.creato=todayStr();d.aggiornato=todayStr();
    const res=await w(()=>S.db.collection("contacts").doc(d.codice.toLowerCase()).set(d)); if(!res)break;
    ok++;codes.add(d.codice);if(d.email)emails.add(normEmail(d.email));
  }
  if(ok)await w(()=>S.db.doc("settings/main").set({...S.settings,maxCodes}));
  toast(`Importati ${ok} contatti${skip?`, ${skip} saltati perché già presenti`:""}`);
}

  const max={S:0,U:0};Object.values(C).forEach(c=>{const m=/^([US])(\d+)$/.exec(c.codice||"");if(m)max[m[1]]=Math.max(max[m[1]],+m[2])});
  Object.keys(C).sort().forEach(id=>{const c=C[id];if(c.codice)return;
    max.U++;const cat=VECCHIE_CATEGORIE[c.categoria]!==undefined?VECCHIE_CATEGORIE[c.categoria]:(SUBCATS[c.categoria]?c.categoria:"");
    C[id]={...DEFAULTS,...c,codice:"U"+String(max.U).padStart(3,"0"),gruppo:"Base utente",categoria:cat,sottocategoria:"",
      statoRecapiti:(c.email||c.telefono)?"Fornito; da verificare":"Da reperire"}});
  Object.keys(C).forEach(id=>{const c=C[id];if(VECCHIE_CATEGORIE[c.categoria]!==undefined)c.categoria=VECCHIE_CATEGORIE[c.categoria];CAMPI.forEach(f=>{if(c[f.k]==null)c[f.k]=""});if(!Array.isArray(c.eventi))c.eventi=[]});
  const main=data.settings.main||{};
  main.maxCodes={S:Math.max(max.S,(main.maxCodes||{}).S||0),U:Math.max(max.U,(main.maxCodes||{}).U||0)};
  data.settings.main=main;
  data.meta={...(data.meta||{}),schema:3,aggiornatoIl:todayStr()};
  return true;
}

/* ---------- archivio nel browser ----------
   Al primo avvio la rubrica parte dai dati iniziali (SEED); da quel momento ogni modifica
   viene salvata nel localStorage di questo browser e ritrovata alle aperture successive. */
const STORAGE_KEY="sf-rubrica-dati-v2";
function makeStoredDB(seed){
  const clone=o=>JSON.parse(JSON.stringify(o));
  let data=null;
  try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)data=JSON.parse(raw)}catch(_){data=null}
  if(!data||typeof data!=="object"||!data.contacts)data=clone(seed);
  else{try{if(!(data.meta&&data.meta.schema>=3)&&!localStorage.getItem(STORAGE_KEY+"-backup"))localStorage.setItem(STORAGE_KEY+"-backup",JSON.stringify(data))}catch(_){}}
  migraDati(data);
  let warned=false;
  const persist=()=>{try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data))}catch(_){if(!warned){warned=true;toast("Questo browser non consente il salvataggio: le modifiche andranno perse alla chiusura.")}}};
  persist();
  const listeners=[];
  const changed=()=>{persist();listeners.slice().forEach(l=>l())};
  const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,10);
  const snap=(id,b)=>({id,exists:!!b,data:()=>b?clone(b):undefined});
  const listen=(emit)=>{listeners.push(emit);setTimeout(emit,0);return()=>{const i=listeners.indexOf(emit);if(i>=0)listeners.splice(i,1)}};
  function docRef(col,id){return{id,
    async get(){return snap(id,(data[col]||{})[id])},
    async set(v){(data[col]=data[col]||{})[id]=clone(v);changed()},
    async update(v){const c=data[col]||{};if(!c[id])throw{code:"invalid_argument",message:"Documento inesistente"};c[id]={...c[id],...clone(v)};changed()},
    async delete(){if(data[col])delete data[col][id];changed()},
    onSnapshot(fn){return listen(()=>fn(snap(id,(data[col]||{})[id])))}}}
  function colRef(col){return{
    doc:id=>docRef(col,id||uid()),
    onSnapshot(fn){return listen(()=>{const docs=Object.entries(data[col]||{}).map(([id,b])=>snap(id,b));fn({docs,size:docs.length,empty:!docs.length})})}}}
  /* aggiorna la vista se la rubrica è aperta in un'altra scheda dello stesso browser */
  window.addEventListener("storage",e=>{if(e.key===STORAGE_KEY&&e.newValue){try{const d=JSON.parse(e.newValue);if(d&&d.contacts){data=d;listeners.slice().forEach(l=>l())}}catch(_){}}});
  return{collection:colRef,doc:p=>{const [c,i]=p.split("/");return docRef(c,i)}};
}

(async function boot(){
  const h=(location.hash||"").slice(1);if(["report","inviti","contatti","eventi"].includes(h))S.tab=h;
  render();
  const db=makeStoredDB(SEED);
  S.db=db;
  sub("contacts","contacts");sub("events","events");sub("invites","invites");sub("reports","reports");
  db.doc("settings/main").onSnapshot(d=>{S.settings={...DEF_SETTINGS,...(d.exists?d.data():{})};requestRender()},()=>{});
})();
</script>
